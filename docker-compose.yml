name: seed-finder
services:
  seed-finder:
    build:
      context: .
      target: app
    container_name: seed-finder
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      TZ: Europe/London
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8103:8000"
    networks: [default, access-net]
    volumes:
      - ./data:/app/data
    cpus: 8
    mem_limit: 2g
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  access-net:
    external: true
